[package]
name = "graft"
version = "0.1.0"
edition = "2024"
description = "Graph anything in your terminal: logs, command output, CSV or JSON"
license = "MIT"
readme = "README.md"
keywords = ["chart", "graph", "terminal", "tui", "plot"]
categories = ["command-line-utilities", "visualization"]

[features]
default = []
# PNG export via resvg (pure Rust, but a sizeable extra compile).
png = ["dep:resvg"]

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive", "wrap_help", "env"] }
clap_complete = "4.6.11"
clap_mangen = "0.3.3"
csv = "1.4.0"
indexmap = "2.14.2"
ratatui = "0.30.2"
regex = "1.13.1"
resvg = { version = "0.49", optional = true }
rhai = { version = "1.27.0", features = ["only_i64"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
toml = "1.1.8"
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
unicode-width = "0.2.3"
ureq = "3.5.1"
webpki-roots = "1"

[profile.release]
lto = "thin"
strip = true
